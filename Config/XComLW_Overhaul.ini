; Only read by LW_Overhaul.X2EventListener_Soldiers (config(LW_Overhaul)), and only meaningful when Long War of the Chosen is actually installed
; and active. Harmless otherwise: LWOTC's class simply never loads.
;
; The slots of a soldier who is on a mission (infiltrating) or a haven adviser are locked in the Armory loadout screen: LWOTC opens it with this list as the slots
; that cannot be edited. A slot that this mod adds is not in LWOTC's list, so it stayed editable on a soldier who was away (same as Spark Arsenal's slots, which
; its own XComLW_Overhaul.ini adds the same way).
[LW_Overhaul.X2EventListener_Soldiers]
; Maniac explosive's extra grenade pockets (UT_ManiacExtraPockets).
+UNMODIFIABLE_SLOTS_WHILE_ON_MISSION=eInvSlot_ExtraGrenadePocket
; Support's vest slot (UT_SupportVestSlot).
+UNMODIFIABLE_SLOTS_WHILE_ON_MISSION=eInvSlot_Vest
