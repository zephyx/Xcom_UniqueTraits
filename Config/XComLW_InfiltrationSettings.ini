; Only read by LW_Overhaul.XComGameState_LWPersistentSquad, and only meaningful when
; Long War of the Chosen is actually installed and active. Harmless otherwise: LWOTC's
; class simply never loads and this file is never parsed by the config system.
;
; Mirrors how LWOTC's own Shinobi abilities (Tradecraft, Covert) modify covertness:
; a multiplier > 1 increases covertness, which increases infiltration time.
[LW_Overhaul.XComGameState_LWPersistentSquad]
+AbilityCovertness=(AbilityName="UT_Bribe", IndividualMultiplier=1.20)
