[UniqueTraits.UT_Trait_AlwaysReady]
; Chance formula: BASE + WillPercentMark * WILL_FACTOR + MissingAmmoPercent * AMMO_FACTOR (each
; percent-mark is 0-100, see UT_Trait_AlwaysReady.OnAbilityActivated's own comment). At full
; Will/full ammo deficit-terms are 0 so only BASE applies; a soldier at 0 Will with an empty clip
; hits BASE + 100*WILL_FACTOR + 100*AMMO_FACTOR (clamped to 100).
ALWAYSREADY_RELOAD_BASE_CHANCE_PCT=5
ALWAYSREADY_RELOAD_WILL_FACTOR=0.2
ALWAYSREADY_RELOAD_AMMO_FACTOR=0.2

[UniqueTraits.UT_Trait_Bribe]
