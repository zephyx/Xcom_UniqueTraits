[UniqueTraits.UT_Trait_SomeoneDifferent]
; Phase 1 (sickness): TOTAL stat points lost from the rank on (not increments); the highest stage whose RankReached is reached applies. The LAST stage is the
; "sergeant" stage: from its rank on the soldier collapses (phase 2). LWOTC: Lance Corporal, Corporal, Sergeant (ranks 2, 3, 4).
+SOMEONEDIFFERENT_STAGES_LWOTC=(RankReached=2, WillMalus=3, AimMalus=2, MobilityMalus=0, HPMalus=0)
+SOMEONEDIFFERENT_STAGES_LWOTC=(RankReached=3, WillMalus=6, AimMalus=5, MobilityMalus=1, HPMalus=0)
+SOMEONEDIFFERENT_STAGES_LWOTC=(RankReached=4, WillMalus=10, AimMalus=10, MobilityMalus=1, HPMalus=1)
; Base game (no Lance Corporal): Corporal, Sergeant (ranks 2, 3), with the LWOTC numbers of the same names.
+SOMEONEDIFFERENT_STAGES_BASEGAME=(RankReached=2, WillMalus=6, AimMalus=5, MobilityMalus=1, HPMalus=0)
+SOMEONEDIFFERENT_STAGES_BASEGAME=(RankReached=3, WillMalus=10, AimMalus=10, MobilityMalus=1, HPMalus=1)
; Phase 2: the soldier falls unconscious at the start of this XCOM turn.
SOMEONEDIFFERENT_KNOCKOUT_TURN=5
; Phase 3 (mutation): percentage on HP, mobility, aim, will, dodge, hacking, psi offense and on the direct damage of his attacks.
; It depends on the SHARE of the evolutions available at his rank (one per promotion column he has reached, the squaddie column excepted) that he bought,
; not on their number. The tables below are fractions of the number of evolution columns, which is 7 with LWOTC and 6 in the base game at max rank (the class's columns
; without the squaddie one): the share is scaled to the current rank columns available and rounded, but the lowest step stays for "none bought" and the highest for "all bought".
; LWOTC: 0/7 -30, 1/7 -20, 2/7 -10, 3 to 5/7 none, 6/7 +12, 7/7 +25. Base game: 0/6 -30, 1/6 -20, 2/6 -10, 3 to 4/6 none, 5/6 +12, 6/6 +25.
; Example: 1 of 2 available (50 %) at LWOTC Corporal rank = 3.5/7 (3/6) = none.
; Evolutions are drawn among the CLASS rows of a column only (never the XCOM row nor LWOTC's pistol row). They are recognized by the class template (the
; rows before the first slot filled from a random deck or holding a pistol ability); in the base game a mod can add an XCOM row that is not recognizable,
; so the number of class rows is capped here (2 in the base game).
SOMEONEDIFFERENT_BASEGAME_CLASS_ROWS=2
+SOMEONEDIFFERENT_PCT_LOW=-30
+SOMEONEDIFFERENT_PCT_LOW=-20
+SOMEONEDIFFERENT_PCT_LOW=-10
+SOMEONEDIFFERENT_PCT_HIGH=25
+SOMEONEDIFFERENT_PCT_HIGH=12

