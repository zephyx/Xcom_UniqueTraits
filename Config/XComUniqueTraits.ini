; UniqueTraits — trait pool.
;
; Each rookie that earns enough XP/kills to choose a class (not GTS/rewards/POI/cheats) receives one of the
; traits below, picked at random among those not already carried by a living soldier. To disable
; a trait without deleting it, set bEnabled=false (or comment the whole +Traits= line out).
;
; RequiredMods lists the .XComMod DLCNames (not DLCIdentifiers) that must ALL be active for a
; trait to be eligible for the draw. A trait is excluded from the pool entirely -- not degraded --
; if any of its required mods aren't loaded, because a trait that can't apply its full intended
; behavior (e.g. a downside that never triggers) would just be a strictly-better freebie and
; unbalance the pool relative to every other trait that has a real cost. Traits with a dependency
; are tagged [REQUIRES: <mod>] in their comment and grouped in their own section below.

[UniqueTraits.UniqueTraits_TraitConfig]

; --- No mod dependency ---

; Athlete: +3 mobility, +15 dodge, -5 aim, -10 crit chance.
+Traits=(TraitID="UT_Athlete", GrantedAbilities=("UT_Athlete"), bEnabled=true)

; Support: carries a free medikit into every mission, and gains a dedicated vest slot (vests go there, not in Utility). Can't carry offensive items (offensive grenades, rockets, ammo) in its other equipment slots.
+Traits=(TraitID="UT_Support", GrantedAbilities=("UT_Support"), bEnabled=true)

; Nerd: +10 hacking/-5 will on promotion, then +4 hacking/-2 will per rank gained after that; takes +2 extra damage from melee attacks.
+Traits=(TraitID="UT_Nerd", GrantedAbilities=("UT_Nerd"), bEnabled=true)

; Pacifist: -20 aim and +30 defense against biological (non-robotic) enemies.
+Traits=(TraitID="UT_Pacifist", GrantedAbilities=("UT_Pacifist"), bEnabled=true)

; Guard: -15 aim, +25 aim and can critically hit on overwatch/reaction shots.
+Traits=(TraitID="UT_Guard", GrantedAbilities=("UT_Guard"), bEnabled=true)

; Scout: free Battle Scanner with +25% throw range, -3 sight radius.
+Traits=(TraitID="UT_Scout", GrantedAbilities=("UT_Scout"), bEnabled=true)

; Baseball player: gains Salvo (heavy weapons/grenades don't end the turn); own explosive damage is reduced by 2 (never below 1).
+Traits=(TraitID="UT_BaseballPlayer", GrantedAbilities=("UT_BaseballPlayer", "Salvo"), bEnabled=true)

; Tactician: -10 aim; a missed shot disorients its target if not robotic.
+Traits=(TraitID="UT_Tactician", GrantedAbilities=("UT_Tactician"), bEnabled=true)

; All in arms: -2 mobility, +5 throw range on hand-thrown items (not launcher/rocket-fired).
+Traits=(TraitID="UT_AllInArms", GrantedAbilities=("UT_AllInArms"), bEnabled=true)

; Maniac explosive: +3 grenade slots, can improvise a free explosive grenade a few times per mission, deals 50% less damage with its primary weapon.
+Traits=(TraitID="UT_ManiacExplosive", GrantedAbilities=("UT_ManiacExplosive", "UT_ManiacImproviseGrenade"), bEnabled=true)

; Always ready: after acting with a weapon that is not full, a chance (higher with low Will and an emptier clip) to force a reload that also ends the turn; enters overwatch at the end of the turn.
+Traits=(TraitID="UT_AlwaysReady", GrantedAbilities=("UT_AlwaysReady", "UT_AlwaysReadyOverwatch"), bEnabled=true)

; Discreet: -20% detection radius; heavy weapons (sniper rifles, cannons) deal 1 less damage.
+Traits=(TraitID="UT_Discreet", GrantedAbilities=("UT_Discreet"), bEnabled=true)

; Quick healing: wounds healed in combat don't count toward recovery time unless the soldier bled out; takes +25% damage.
+Traits=(TraitID="UT_QuickHealing", GrantedAbilities=("UT_QuickHealing"), bEnabled=true)

; Acrobat: gains Grapple; -10 aim/-10 crit when attacking a target below their own elevation.
+Traits=(TraitID="UT_Acrobat", GrantedAbilities=("UT_Acrobat", "Grapple"), bEnabled=true)

; Thief: picking up loot (XCOM's turn only) grants a bonus movement point (once per turn); 20% chance to secretly keep (steal) that item, flagged with a flyover.
+Traits=(TraitID="UT_Thief", GrantedAbilities=("UT_Thief"), bEnabled=true)

; Hunter: every 2 turns without seeing an enemy, the squad hears nearby enemy movement; enemies detect this soldier from about 2 tiles farther.
+Traits=(TraitID="UT_Hunter", GrantedAbilities=("UT_Hunter"), bEnabled=true)

; False Hope: +12 aim/+3 HP on promotion, then -1.5 aim/-0.5 HP (the HP bonus floors at 0, it never becomes a malus) per rank gained after that; earns 20% less XP.
+Traits=(TraitID="UT_FalseHope", GrantedAbilities=("UT_FalseHope"), bEnabled=true)

; Long Range: far-range penalty reduced (uses the value 3 tiles closer); -20/-15/-10/-5 aim on the 4 nearest tiles with a ranged weapon.
+Traits=(TraitID="UT_LongRange", GrantedAbilities=("UT_LongRange"), bEnabled=true)

; Quality over quantity: the primary weapon gets +5/+10/+15% critical chance by weapon tier, but loses 1 clip when it has 3 or more.
+Traits=(TraitID="UT_QualityOverQuantity", GrantedAbilities=("UT_QualityOverQuantity"), bEnabled=true)

; Bounty hunter: every kill made by this soldier earns 2 supplies (listed in the mission rewards), with a "Bounty" flyover, but 20% of his kills grant no experience.
+Traits=(TraitID="UT_BountyHunter", GrantedAbilities=("UT_BountyHunter"), bEnabled=true)

; Cyborg: can only wear basic personal combat sims (stat boosts, no ability); a replaced PCS goes back to the inventory instead of being lost; after a victorious mission, 30% chance to upgrade each worn PCS by one tier.
+Traits=(TraitID="UT_Cyborg", GrantedAbilities=("UT_Cyborg"), bEnabled=true)

; --- [REQUIRES: Community Promotion Screen] (workshop id 2550561145, DLCName X2WOTCCommunityPromotionScreen) ---
; Without it, only the AP bonus would apply and never the drawback, so the trait is excluded entirely instead.

; Jack of all trades: +15 bonus Ability Points on promotion; can never buy the xcom's top-cost ability row (~35 AP in LWOTC). [REQUIRES: Community Promotion Screen]
+Traits=(TraitID="UT_JackOfAllTrades", GrantedAbilities=("UT_JackOfAllTrades"), RequiredMods=("X2WOTCCommunityPromotionScreen"), bEnabled=true)

; --- [REQUIRES: Long War of the Chosen] (DLCName LongWarOfTheChosen) ---

; Swordsman: melee damage and armor pierce +1/+1/+2/+2/+3 by weapon tier; firearms deal 1 less damage; cannot equip a pistol (slot blocked, and with Community Promotion Screen its ability row can't be bought). [REQUIRES: LWOTC -- the pistol slot comes from it]
+Traits=(TraitID="UT_Swordsman", GrantedAbilities=("UT_Swordsman"), RequiredMods=("LongWarOfTheChosen"), bEnabled=true)

; Bribe: +20 monthly supplies for the haven (region) the holder advises, but adds roughly 6 hours to squad infiltration time. [REQUIRES: LWOTC]
+Traits=(TraitID="UT_Bribe", GrantedAbilities=("UT_Bribe"), RequiredMods=("LongWarOfTheChosen"), bEnabled=true)

; Stay focus: free action (2-turn cooldown) grants nearby allies +10 aim/+5 crit until XCOM's next turn; costs the user 4 Will each use. [REQUIRES: LWOTC]
+Traits=(TraitID="UT_StayFocus", GrantedAbilities=("UT_StayFocus"), RequiredMods=("LongWarOfTheChosen"), bEnabled=true)

; Smoker: 2 free smoke grenades that don't end the turn when thrown (still costs the normal action point); gains 10 will, once, for each smoke grenade that lands where this soldier is standing; doubles per-turn fatigue will loss. [REQUIRES: LWOTC]
+Traits=(TraitID="UT_Smoker", GrantedAbilities=("UT_Smoker"), RequiredMods=("LongWarOfTheChosen"), bEnabled=true)

; Born to be chief: -12 aim/dodge/will baseline, +4 to each per officer rank held; also grants Quick Study. [REQUIRES: LWOTC]
+Traits=(TraitID="UT_BornToBeChief", GrantedAbilities=("UT_BornToBeChief", "QuickStudy"), RequiredMods=("LongWarOfTheChosen"), bEnabled=true)

; Recruiter: -20 dodge; each month, X% chance (X = share of the month spent as haven adviser) of one more soldier in the recruitable pool, and X/2 % chance of a free rookie in the roster. [REQUIRES: LWOTC]
+Traits=(TraitID="UT_Recruiter", GrantedAbilities=("UT_Recruiter"), RequiredMods=("LongWarOfTheChosen"), bEnabled=true)

