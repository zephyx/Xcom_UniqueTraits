; UniqueTraits — trait pool.
;
; Each rookie that earns enough XP/kills to choose a class (not GTS/rewards/POI/cheats; or as soon as it joins the roster with
; ASSIGN_TRAIT_AT_RECRUITMENT=true) receives one of the
; traits below, picked at random among those not already carried by a living soldier. The draw is WEIGHTED: each trait has a probability (a weight,
; relative to the others): DEFAULT_TRAIT_PROBABILITY below unless the trait's +Traits= line gives its own with Probability=<n> (a trait of weight 2 is drawn
; 5 times less often than one of weight 10). A line without Probability= uses the default; to disable a trait without deleting it, write Probability=0
; explicitly (or comment the whole +Traits= line out).
;
; RequiredMods lists the .XComMod DLCNames (not DLCIdentifiers) that must ALL be active for a
; trait to be eligible for the draw. A trait is excluded from the pool entirely -- not degraded --
; if any of its required mods aren't loaded, because a trait that can't apply its full intended
; behavior (e.g. a downside that never triggers) would just be a strictly-better freebie and
; unbalance the pool relative to every other trait that has a real cost. Traits with a dependency
; are tagged [REQUIRES: <mod>] in their comment and grouped in their own section below.

[UniqueTraits.UniqueTraits_TraitConfig]

; The probability (weight in the draw) of every trait that has no Probability= of its own. Only the proportions matter: 10 for all = 1 in N each.
DEFAULT_TRAIT_PROBABILITY=10

; false (default): a rookie gets its trait when it earns enough XP/kills to choose a class (after a mission or a covert action).
; true: it gets it as soon as it is a rookie of the roster (recruit, rescued rookie, soldier of a new campaign...). Reward soldiers are created ranked
; and get none. A rookie who finds the pool empty is tried again at the next opportunity (new crew member, mission, covert action, load).
ASSIGN_TRAIT_AT_RECRUITMENT=false

; --- No mod dependency ---

; Athlete: +3 mobility, +15 dodge, -5 aim, -10 crit chance.
+Traits=(TraitID="UT_Athlete", GrantedAbilities=("UT_Athlete"))

; Support: +1 mobility, carries a free medikit into every mission, and gains a dedicated vest slot (vests go there, not in Utility). Can't carry offensive items (offensive grenades, rockets, ammo) in its Utility slots (the dedicated grenade and ammo pockets are not restricted).
+Traits=(TraitID="UT_Support", GrantedAbilities=("UT_Support"))

; Nerd: +10 hacking/-5 will on promotion, then +4 hacking/-2 will per rank gained after that; takes +2 extra damage from melee attacks.
+Traits=(TraitID="UT_Nerd", GrantedAbilities=("UT_Nerd"))

; Pacifist: free ability "Stay covered" (no action point needed, cooldown 1), usable if he inflicted no damage during the previous turn: every ally within 6 tiles of him (himself included) gets +10 defense and +5 dodge until the next turn. Loses all overwatch abilities.
+Traits=(TraitID="UT_Pacifist", GrantedAbilities=("UT_Pacifist"))

; Guard: -15 aim, +25 aim and can critically hit on every overwatch/reaction attack (ranged or melee).
+Traits=(TraitID="UT_Guard", GrantedAbilities=("UT_Guard"))

; Scout: free Battle Scanner with +25% throw range, -3 sight radius.
+Traits=(TraitID="UT_Scout", GrantedAbilities=("UT_Scout"))

; Baseball player: gains its own copy of Salvo (UT_BaseballSalvo: heavy weapons/grenades don't end the turn) with Bombardier's +2 grenade range; own explosive damage is reduced by 2 (never below 1).
+Traits=(TraitID="UT_BaseballPlayer", GrantedAbilities=("UT_BaseballPlayer", "UT_BaseballSalvo"))

; Tactician: -10 aim; a missed shot disorients its target if not robotic.
+Traits=(TraitID="UT_Tactician", GrantedAbilities=("UT_Tactician"))

; All in arms: -2 mobility, +5 throw range on hand-thrown items (not launcher/rocket-fired).
+Traits=(TraitID="UT_AllInArms", GrantedAbilities=("UT_AllInArms"))

; Maniac explosive: +3 grenade slots, can improvise a free explosive grenade a few times per mission, its primary weapon deals 50% less base damage (before other modifiers).
+Traits=(TraitID="UT_ManiacExplosive", GrantedAbilities=("UT_ManiacExplosive", "UT_ManiacImproviseGrenade"))

; Always ready: after acting with a weapon that is not full, a chance (higher with low Will and an emptier clip) to force a reload that also ends the turn; enters overwatch at the end of the turn.
+Traits=(TraitID="UT_AlwaysReady", GrantedAbilities=("UT_AlwaysReady", "UT_AlwaysReadyOverwatch"))

; Discreet: -20% detection radius; primary weapons deal 1 less damage (never below 1).
+Traits=(TraitID="UT_Discreet", GrantedAbilities=("UT_Discreet"))

; Quick healing: wounds healed in combat don't count toward recovery time unless the soldier bled out; takes +25% damage.
+Traits=(TraitID="UT_QuickHealing", GrantedAbilities=("UT_QuickHealing"))

; Acrobat: gains the Skirmisher's Grapple (cd 3) -10 aim/-10 crit when attacking a target below their own elevation.
+Traits=(TraitID="UT_Acrobat", GrantedAbilities=("UT_Acrobat", "SkirmisherGrapple"))

; Thief: picking up loot (XCOM's turn only) grants a bonus movement point (once per turn); 20% chance to secretly keep (steal) that item, flagged with a flyover.
+Traits=(TraitID="UT_Thief", GrantedAbilities=("UT_Thief"))

; Hunter: every 2 turns without seeing an enemy, the squad hears nearby enemy movement; enemies detect this soldier from about 2 tiles farther.
+Traits=(TraitID="UT_Hunter", GrantedAbilities=("UT_Hunter"))

; False Hope: +12 aim/+3 HP on promotion, then -1.5 aim/-0.5 HP (the HP bonus floors at 0, it never becomes a malus) per rank gained after that; earns 20% less XP.
+Traits=(TraitID="UT_FalseHope", GrantedAbilities=("UT_FalseHope"))

; Long Range: far-range penalty reduced (uses the value 3 tiles closer); -20/-15/-10/-5 aim on the 4 nearest tiles with a ranged weapon.
+Traits=(TraitID="UT_LongRange", GrantedAbilities=("UT_LongRange"))

; Quality over quantity: the primary weapon gets +5/+10/+15% critical chance by weapon tier, but loses 1 clip when it has 3 or more.
+Traits=(TraitID="UT_QualityOverQuantity", GrantedAbilities=("UT_QualityOverQuantity"))

; Bounty hunter: every kill made by this soldier earns 2 supplies (listed in the mission rewards), with a "Bounty" flyover, but 20% of his kills grant no experience.
+Traits=(TraitID="UT_BountyHunter", GrantedAbilities=("UT_BountyHunter"))

; Cyborg: can only wear basic personal combat sims (stat boosts, no ability); a replaced PCS goes back to the inventory instead of being lost; after a victorious mission, 30% chance to upgrade each worn PCS by one tier.
+Traits=(TraitID="UT_Cyborg", GrantedAbilities=("UT_Cyborg"))

; Young doctor: free medikit, but 25% fewer HP healed; the first time he treats each soldier in a combat (himself included) he earns the XP of a kill (1/2/3 times per combat by rank), double for a stabilization.
+Traits=(TraitID="UT_YoungDoctor", GrantedAbilities=("UT_YoungDoctor"))

; Psi adept: the primary weapon gets 1 armor piercing per 10 Psi Offense and +1 damage per 20 (neither against robotic units, which take -20% damage instead).
+Traits=(TraitID="UT_PsiAdept", GrantedAbilities=("UT_PsiAdept"))

; Give me more: -10 defense, +10 dodge; 3 cound recovery time reduction (like surgeon x3).
+Traits=(TraitID="UT_GiveMeMore", GrantedAbilities=("UT_GiveMeMore"))

; Mind over matter: permanent HP/mobility/aim and wound recovery time bonus/malus that follow the max Will: negative below about 37 Will (e.g. 23 Will: -1 HP, -1 mobility, -3 aim, recovery +17%), positive above (e.g. 60 Will: +1 HP, +3 aim, recovery -27%; the mobility malus lasts up to 37 Will).
+Traits=(TraitID="UT_MindOverMatter", GrantedAbilities=("UT_MindOverMatter"))

; Chemist: every damage over time (poison, bleeding, acid, burning...) the holder inflicts on a non-robotic enemy gives it the Disease (-1 damage, -10 aim on its attacks, 1 turn); the holder takes 1 extra damage from damage over time.
+Traits=(TraitID="UT_Chemist", GrantedAbilities=("UT_Chemist"))

; Psychic Bond: with his bondmate (when deployed together) the holder shares, for the mission, the best base stats of the two (aim, mobility, will, dodge, psi offense, hacking, and the HP gain as ablative protection); each loses 50% of the damage the other takes (never lethal).
+Traits=(TraitID="UT_PsychicBond", GrantedAbilities=("UT_PsychicBond"))

; Laser designator: free ability (cooldown 2): the next primary weapon shot or holotarget on an enemy makes it lose Shadowstep and GAIN 15 dodge for 1 turn; a holotargeted enemy shortens the cooldown by 1.
+Traits=(TraitID="UT_LaserDesignator", GrantedAbilities=("UT_LaserDesignator"))

; Security hacker: when the holder hacks a security tower it gives the same rewards as the computers, but its hack defense is doubled and a failed hack deals 20% of the hacker's max HP (rounded up) in damage through the ablative protection (Failsafe cannot cancel it). Other soldiers get the normal tower.
+Traits=(TraitID="UT_SecurityHacker", GrantedAbilities=("UT_SecurityHacker"))

; Nemesis: each kill made with a primary, secondary or pistol-slot weapon permanently gives +2 aim against that enemy type (summoned units included) and gives that type +2 chance to hit the holder (-2 defense); capped at +16 / -16.
+Traits=(TraitID="UT_Nemesis", GrantedAbilities=("UT_Nemesis"))

; Meat Tenderizer: what the holder would stun is Tenderized instead (-8 mobility, and every unit that attacks it gets +30 aim and +30 crit, as long as the stun would have lasted) and what he would disorient is Slightly Tenderized (-4 mobility, +15 aim / +15 crit); he gets a standard action point back each time (max 1 per turn). The two do not stack.
+Traits=(TraitID="UT_MeatTenderizer", GrantedAbilities=("UT_MeatTenderizer"))

; Shredder: when the primary weapon shreds an enemy's armor, that enemy gets Acid (the damage of an acid grenade's acid). Every acid the soldier inflicts deals +2 damage per turn; the primary weapon deals 10% less damage to targets without armor.
+Traits=(TraitID="UT_Shredder", GrantedAbilities=("UT_Shredder"))

; Stay focus: free action (2-turn cooldown) grants nearby allies +10 aim/+5 crit until XCOM's next turn; costs the user 4 Will each use.
+Traits=(TraitID="UT_StayFocus", GrantedAbilities=("UT_StayFocus"))

; Self-reinforcement: a covert operation this soldier takes part in lasts 50% longer (once, however many holders); when the operation grants him a stat increase, the increase is doubled.
+Traits=(TraitID="UT_SelfReinforcement", GrantedAbilities=("UT_SelfReinforcement"))

; Reliable: never makes a critical hit. The crit chance of each shot becomes aim (+1 per 2 points, rounded up) and lowers the target's dodge by the same amount as the crit chance.
+Traits=(TraitID="UT_Reliable", GrantedAbilities=("UT_Reliable"))

; --- [REQUIRES: Community Promotion Screen] (workshop id 2550561145, DLCName X2WOTCCommunityPromotionScreen) ---
; Without it, only the AP bonus would apply and never the drawback, so the trait is excluded entirely instead.

; Jack of all trades: +15 bonus Ability Points on promotion; can never buy the xcom's top-cost ability row (~35 AP in LWOTC). [REQUIRES: Community Promotion Screen]
+Traits=(TraitID="UT_JackOfAllTrades", GrantedAbilities=("UT_JackOfAllTrades"), RequiredMods=("X2WOTCCommunityPromotionScreen"))

; Someone different: escaped from an alien laboratory and gets sicker with each rank (stat maluses up to Sergeant); during the first mission as a Sergeant he collapses (unconscious at the start of the 5th turn); after that mission he is respecced and mutates: passive Mutant, one random "evolution" ability per promotion column but the squaddie one (green diamond on the promotion screen). The more evolutions he buys the stronger he is (-30% to +25% on his stats and his damage). Rare on purpose: Probability=2 against the default 10, so 5 times less likely to be drawn than a classic trait. [REQUIRES: Community Promotion Screen]
+Traits=(TraitID="UT_SomeoneDifferent", GrantedAbilities=("UT_SomeoneDifferent"), RequiredMods=("X2WOTCCommunityPromotionScreen"), Probability=2)

; --- [REQUIRES: Long War of the Chosen] (DLCName LongWarOfTheChosen) ---

; Swordsman: melee damage and armor pierce +1/+1/+2/+2/+3 by weapon tier; firearms deal 1 less damage; cannot equip a pistol (slot blocked, and with Community Promotion Screen its ability row can't be bought). [REQUIRES: LWOTC -- the pistol slot comes from it]
+Traits=(TraitID="UT_Swordsman", GrantedAbilities=("UT_Swordsman"), RequiredMods=("LongWarOfTheChosen"))

; Bribe: +20 monthly supplies for the haven (region) the holder advises, but adds roughly 6 hours to squad infiltration time. [REQUIRES: LWOTC]
+Traits=(TraitID="UT_Bribe", GrantedAbilities=("UT_Bribe"), RequiredMods=("LongWarOfTheChosen"))

; Smoker: 2 free smoke grenades that don't end the turn when thrown (still costs the normal action point); gains 10 will, once, for each smoke grenade that lands where this soldier is standing; doubles per-turn fatigue will loss. [REQUIRES: LWOTC]
+Traits=(TraitID="UT_Smoker", GrantedAbilities=("UT_Smoker"), RequiredMods=("LongWarOfTheChosen"))

; Born to be chief: -9 aim/dodge/will baseline, +3 to each per officer rank held; also grants Quick Study. [REQUIRES: LWOTC]
+Traits=(TraitID="UT_BornToBeChief", GrantedAbilities=("UT_BornToBeChief", "QuickStudy"), RequiredMods=("LongWarOfTheChosen"))

; Recruiter: -20 dodge; each month, X% chance (X = share of the month spent as haven adviser) of one more soldier in the recruitable pool, and X/2 % chance of a free rookie in the roster. [REQUIRES: LWOTC]
+Traits=(TraitID="UT_Recruiter", GrantedAbilities=("UT_Recruiter"), RequiredMods=("LongWarOfTheChosen"))

