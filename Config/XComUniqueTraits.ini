MINDOVERMATTER_MOBILITY_MALUS=2
MINDOVERMATTER_AIM_MALUS=6
MINDOVERMATTER_RECOVERY_MALUS_PCT=45
; Starting malus of each stat (stat points) and of the recovery time (+% of time), then the part of the max Will given back: PCT_OF_WILL % of the
; Will in stat points (rounded) and, for the recovery time, in % of time removed (60 Will x 120% = 72% => 45 - 72 = -27%).
MINDOVERMATTER_HP_PCT_OF_WILL=7.0
MINDOVERMATTER_MOBILITY_PCT_OF_WILL=4.0
MINDOVERMATTER_AIM_PCT_OF_WILL=15.0
