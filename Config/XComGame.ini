[UniqueTraits.X2DownloadableContentInfo_UniqueTraits]
DLCIdentifier="UniqueTraits"

[UniqueTraits CHModDependency]
DisplayName="UniqueTraits"
+RequiredMods="X2WOTCCommunityHighlander"

; Meat Tenderizer patches every stun / disorient effect of the templates in OnPostTemplatesCreated: it must see the effects other mods add in theirs
; (Merist perk pack's Improved Suppression adds a disorient to the suppression abilities there).
; Merist's perk pack is also RUN_LAST and two DLCInfos of the same group have no defined order, hence the explicit RunAfter.
; It is Merist's X2DLCInfo_MeristPerkPack that adds the stun / disorient effects (OnPostTemplatesCreated).
[UniqueTraits CHDLCRunOrder]
RunPriorityGroup=RUN_LAST
+RunAfter=MeristPerkPack
